<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — BuildStore</title>
  <link rel="stylesheet" href="/frontend/css/styles.css">
  <script src="/frontend/js/theme.js" defer></script>
  <script src="/frontend/js/api.js" defer></script>
  <script src="/frontend/js/layout.js" defer></script>
  <script src="/frontend/js/auth.js" defer></script>
  <script src="/frontend/js/cart.js" defer></script>
  <script src="/frontend/js/listings.js" defer></script>
</head>
<body>
  <header id="site-header"></header>

  <main class="container page-main">

    <!-- Экран 1: плитки категорий -->
    <section id="categoriesSection" aria-labelledby="catalogTitle">
      <h1 id="catalogTitle" class="page-title">Каталог</h1>
      <div id="categoryGrid" class="category-grid" aria-live="polite">
        <div class="empty-state"><div class="empty-state-title">Загружаем каталог…</div></div>
      </div>
    </section>

    <!-- Экран 2: товары категории или результаты поиска -->
    <section id="productsSection" hidden>
      <button type="button" id="backBtn" class="btn btn-secondary btn-sm">Все категории</button>
      <h1 id="categoryTitle" class="page-title"></h1>

      <div class="catalog-layout">
        <aside id="filtersPanel" class="filters-panel" aria-label="Фильтры">
          <h2 class="filters-title">Фильтры</h2>

          <label class="checkbox-row"><input type="checkbox" id="fInStock"> <span>В наличии</span></label>
          <label class="checkbox-row"><input type="checkbox" id="fDiscount"> <span>Только со скидкой</span></label>

          <label class="filter-label" for="fRating">Минимальный рейтинг</label>
          <select id="fRating" class="input">
            <option value="0">Любой</option>
            <option value="3">от 3 звёзд</option>
            <option value="4">от 4 звёзд</option>
          </select>

          <label class="filter-label" for="fMaxPrice">Цена до, ₽</label>
          <input type="number" id="fMaxPrice" class="input" min="0" placeholder="Например, 5000">

          <div class="filters-actions">
            <button type="button" id="clearFiltersBtn" class="btn btn-secondary btn-sm">Сбросить</button>
            <button type="button" id="applyFiltersBtn" class="btn btn-primary btn-sm">Применить</button>
          </div>
        </aside>

        <div>
          <div id="productsGrid" class="listings-grid" aria-live="polite"></div>
          <div id="paginationContainer" class="pagination"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
